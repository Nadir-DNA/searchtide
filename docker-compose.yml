services:
  searchtide:
    # Image publiée (T25) : docker compose pull && docker compose up -d --no-build
    # Sans image publiée, `docker compose up -d --build` construit localement et utilise ce même nom.
    image: ${SEARCHTIDE_IMAGE:-ghcr.io/nadir-dna/searchtide:v0.2.0}
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      # Facultatif : sans ces variables, SECRET et ADMIN_PASSWORD sont générés au premier lancement
      # et affichés dans les journaux (docker compose logs searchtide).
      SECRET: ${SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - searchtide_data:/data
      # Clé Google (optionnelle) : la monter dans un docker-compose.override.yml, voir le README

  # Optionnel : publie l'instance via un tunnel Cloudflare (TUNNEL_TOKEN dans .env).
  # Lancer avec : docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.8.3
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [searchtide]
    restart: unless-stopped

volumes:
  searchtide_data:
