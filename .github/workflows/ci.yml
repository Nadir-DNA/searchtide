name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Construire l'interface
        run: npm run build

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run e2e

      - name: Garder la trace Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
